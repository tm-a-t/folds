[project]
name = "folds"
version = "0.2.1"
description = "An elegant and scalable framework for Telegram bots, based on Telethon"
license = "MIT"
readme = "readme.md"
homepage = "https://papercraft.tmat.me/folds"
repository = "https://github.com/tm-a-t/folds"
authors = [
    { name = "Artem Ivanov", email = "tmat.ivanov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "telethon>=1.44.0",
    "watchfiles~=1.1.1",
]

[tool.uv.sources]
folds = { workspace = true }
telethon = { git = "https://codeberg.org/Lonami/Telethon.git" }

[tool.uv.workspace]
members = ["examples/*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "TCH", "UP", "ANN"]
ignore = ["F811", "B008", "ANN401"]

[tool.ruff.per-file-ignores]
"examples/**" = ["ANN"]

[tool.ruff.lint.flake8-annotations]
suppress-none-returning = true

[tool.ty.src]
exclude = ["examples/**"]  # temporary

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff>=0.15.10",
    "ty>=0.0.31",
]
